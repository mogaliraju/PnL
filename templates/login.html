<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in | Presales PnL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ax-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ax.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
  <style>
    .login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
    .login-art {
      background: var(--navy); color: #fff; padding: 48px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .login-brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
    .login-brand img { width: 44px; height: 44px; border-radius: 10px; }
    .login-art h2 { font-size: 36px; line-height: 1.15; max-width: 15ch; margin: 0 0 12px; }
    .login-art p { color: #C9C7F0; max-width: 42ch; margin: 0; }
    .login-art small { color: #8E8BC9; }
    .login-form-side { display: flex; align-items: center; justify-content: center; padding: 32px 16px; background: var(--surface); }
    .login-form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 16px; }
    .login-form .ax-btn { height: 40px; width: 100%; }
    .login-help { font-size: 13px; color: var(--ink-3); margin: 0; }
    #error-msg { display: none; margin: 0; padding: 10px 12px; border-radius: var(--radius-control); background: var(--bad-soft); color: var(--bad); font-size: 14px; }
    @media (max-width: 860px) { .login { grid-template-columns: minmax(0, 1fr); } .login-art { display: none; } }
  </style>
</head>
<body>
  <div class="login">
    <section class="login-art">
      <div class="login-brand"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="">AutomatonsX</div>
      <div>
        <h2>Price every proposal from one source of truth.</h2>
        <p>Resource plans, rate cards and margins in one place, with every version kept.</p>
      </div>
      <small>Presales PnL</small>
    </section>
    <section class="login-form-side">
      <form class="login-form" id="login-form" onsubmit="doLogin(event)" novalidate>
        <div>
          <h1 class="ax-h1">Sign in</h1>
          <p class="ax-muted" style="margin:6px 0 0">Use the account your admin created for you.</p>
        </div>
        <div class="ax-field">
          <label for="username">Username</label>
          <input class="ax-input" id="username" autocomplete="username" autocapitalize="none" required autofocus>
        </div>
        <div class="ax-field">
          <label for="password">Password</label>
          <input class="ax-input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="error-msg" role="alert"></p>
        <button type="submit" class="ax-btn ax-btn--primary" id="login-btn">Sign in</button>
        <p class="login-help">Forgot your password? Ask an admin to reset it from Users.</p>
      </form>
    </section>
  </div>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error-msg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const fail = msg => { err.textContent = msg; err.style.display = 'block'; btn.textContent = 'Sign in'; btn.disabled = false; };
      err.style.display = 'none';
      if (!username || !password) { fail('Enter your username and password.'); return; }
      btn.textContent = 'Signing in…'; btn.disabled = true;
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) { window.location.href = '/'; return; }
        if (res.status === 401) fail("That username and password don't match. Try again or ask an admin to reset it.");
        else fail("We couldn't sign you in just now. Try again in a minute.");
      } catch {
        fail("We couldn't reach the server. Check your connection and try again.");
      }
    }
  </script>
</body>
</html>
