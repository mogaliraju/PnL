services:
  - type: web
    name: pnl-automatonsx
    plan: free
    runtime: python
    # npm installs the docx package the proposal builder (proposals/skill/scripts/build_proposal.js) needs.
    buildCommand: pip install -r requirements.txt && npm ci --omit=dev
    # Threads keep one streaming assistant answer from blocking everyone else.
    startCommand: gunicorn --worker-class gthread --threads 8 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard to your Neon/Supabase URL
      - key: DATA_DIR
        value: /tmp
      - key: SECRET_KEY
        generateValue: true
      - key: PNL_ENV
        value: production    # requires SECRET_KEY; the assistant's local demo mode is off
      - key: PNL_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: PNL_BOOTSTRAP_ADMIN_PASSWORD
        sync: false          # Only used when there are no users. Set it in the dashboard, never in git.
      # PnL assistant: Claude Opus 4.6 on Amazon Bedrock (global profile from Mumbai); fallbacks Sonnet 4.5, then GPT OSS 120B
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false          # Bedrock API key
      - key: AWS_REGION
        value: ap-south-1
      - key: BEDROCK_MODEL_ID
        value: global.anthropic.claude-opus-4-6-v1
      - key: BEDROCK_FALLBACK_MODEL_ID
        value: global.anthropic.claude-sonnet-4-5-20250929-v1:0,openai.gpt-oss-120b-1:0
      # Proposal writer (design/PROPOSALS.md): Opus 4.6, Sonnet 4.5 if Opus fails
      - key: BEDROCK_PROPOSAL_MODEL_ID
        value: global.anthropic.claude-opus-4-6-v1
      - key: ASSISTANT_DATABASE_URL
        sync: false          # optional: a SELECT-only Postgres role for the assistant's tools
