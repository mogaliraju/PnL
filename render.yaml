services:
  - type: web
    name: pnl-automatonsx
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py; gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard to your Neon/Supabase URL
      - key: DATA_DIR
        value: /tmp
      - key: SECRET_KEY
        generateValue: true
      - key: PNL_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: PNL_BOOTSTRAP_ADMIN_PASSWORD
        value: Admin@12345
