services:
  - type: web
    name: pnl-automatonsx
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATA_DIR
        value: /tmp
      - key: PNL_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: PNL_BOOTSTRAP_ADMIN_PASSWORD
        value: Admin@12345
